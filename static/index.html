<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CircuitGen Build Interface</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 0 auto; padding: 24px; background: #f7f7f8; color: #222; }
    h1 { font-size: 24px; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    label { display: block; margin: 8px 0 4px; font-weight: bold; font-size: 14px; }
    select, input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 10px 16px; background: #0066cc; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    button:hover { background: #0052a3; }
    #result { background: #f0f0f0; border-radius: 6px; padding: 12px; white-space: pre-wrap; word-wrap: break-word; margin-top: 12px; font-family: monospace; font-size: 13px; }
  </style>
</head>
<body>
  <h1>CircuitGen Build Interface</h1>

  <div class="card">
    <h2>1. Design Parameters (set before building)</h2>
    <label for="dpName">Design Name</label>
    <input id="dpName" type="text" value="patch_2p4ghz_fr4">
    <label for="dpType">Antenna Type</label>
    <select id="dpType">
      <option value="patch">Patch</option>
      <option value="monopole">Monopole</option>
      <option value="dipole">Dipole</option>
    </select>
    <label for="dpFreq">Frequency (GHz)</label>
    <input id="dpFreq" type="number" step="0.1" value="2.4">
    <label for="dpSubstrate">Substrate</label>
    <select id="dpSubstrate">
      <option value="FR4">FR4 (er 4.4)</option>
      <option value="Rogers5880">Rogers5880 (er 2.2)</option>
      <option value="Rogers4350B">Rogers4350B (er 3.48)</option>
    </select>
    <label for="dpThickness">Thickness (mm)</label>
    <input id="dpThickness" type="number" step="0.01" placeholder="substrate default">
    <label for="dpFeed">Feed Type</label>
    <select id="dpFeed">
      <option value="edge_inset">Edge inset</option>
      <option value="inset">Inset</option>
    </select>
    <button id="setParamsBtn">Set Design Parameters</button>
    <button id="loadDesignsBtn" style="background:#555">Refresh Saved Designs</button>
  </div>

  <div class="card">
    <h2>2. Build Antenna in HFSS</h2>
    <label for="antType">Antenna Type</label>
    <select id="antType">
      <option value="patch">Patch</option>
      <option value="monopole">Monopole</option>
      <option value="dipole">Dipole</option>
      <option value="yagi">Yagi</option>
    </select>
    <label for="antFreq">Frequency (GHz)</label>
    <input id="antFreq" type="number" step="0.1" value="2.4">
    <label for="antSubstrate">Substrate</label>
    <input id="antSubstrate" type="text" value="FR4">
    <label for="antThickness">Thickness (mm)</label>
    <input id="antThickness" type="number" step="0.1" value="1.6">
    <button id="buildAntBtn">Build Antenna</button>
    <label for="designName">Build from saved design</label>
    <select id="designName"></select>
    <button id="buildFromDesignBtn" style="background:#555">Build Saved Design</button>
  </div>

  <div class="card">
    <h2>Result</h2>
    <pre id="result">{}</pre>
  </div>

  <script>
    const resultEl = document.getElementById('result');

    async function post(path, body) {
      const r = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      return await r.json();
    }

    async function loadDesigns() {
      try {
        const r = await fetch('/design/params');
        const data = await r.json();
        const select = document.getElementById('designName');
        select.innerHTML = '';
        (data.designs || []).forEach(d => {
          const opt = document.createElement('option');
          opt.value = d.name;
          opt.textContent = `${d.name} (${d.antenna_type}, ${d.frequency_ghz} GHz, ${d.substrate})`;
          select.appendChild(opt);
        });
      } catch (e) {
        console.error(e);
      }
    }

    loadDesigns();

    document.getElementById('setParamsBtn').addEventListener('click', async () => {
      const payload = {
        name: document.getElementById('dpName').value,
        antenna_type: document.getElementById('dpType').value,
        frequency_ghz: parseFloat(document.getElementById('dpFreq').value) || 2.4,
        substrate: document.getElementById('dpSubstrate').value,
        feed_type: document.getElementById('dpFeed').value,
      };
      const thickness = parseFloat(document.getElementById('dpThickness').value);
      if (!isNaN(thickness)) payload.thickness_mm = thickness;

      resultEl.textContent = 'Deriving design parameters...';
      try {
        const res = await post('/design/params', payload);
        resultEl.textContent = JSON.stringify(res, null, 2);
        await loadDesigns();
      } catch (e) {
        resultEl.textContent = 'ERROR: ' + e;
      }
    });

    document.getElementById('loadDesignsBtn').addEventListener('click', async () => {
      await loadDesigns();
      resultEl.textContent = 'Saved designs refreshed.';
    });

    document.getElementById('buildFromDesignBtn').addEventListener('click', async () => {
      const name = document.getElementById('designName').value;
      if (!name) {
        resultEl.textContent = 'No saved design selected.';
        return;
      }
      resultEl.textContent = 'Building saved design...';
      try {
        const res = await post('/design/build', { name: name });
        resultEl.textContent = JSON.stringify(res, null, 2);
      } catch (e) {
        resultEl.textContent = 'ERROR: ' + e;
      }
    });

    document.getElementById('buildAntBtn').addEventListener('click', async () => {
      const payload = {
        antenna_type: document.getElementById('antType').value,
        frequency_ghz: parseFloat(document.getElementById('antFreq').value) || 2.4,
        substrate: document.getElementById('antSubstrate').value,
        thickness_mm: parseFloat(document.getElementById('antThickness').value) || 1.6,
      };
      resultEl.textContent = 'Building antenna...';
      try {
        const res = await post('/hfss/build', payload);
        resultEl.textContent = JSON.stringify(res, null, 2);
      } catch (e) {
        resultEl.textContent = 'ERROR: ' + e;
      }
    });
  </script>
</body>
</html>
